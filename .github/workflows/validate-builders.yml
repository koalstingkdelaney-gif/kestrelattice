name: Validate Python builders

on:
  pull_request:
    paths:
      - "build-product-pages.py"
      - "build-admin.py"
      - "_admin_sections.py"
      - ".github/workflows/validate-builders.yml"
  push:
    branches: [main]
    paths:
      - "build-product-pages.py"
      - "build-admin.py"
      - "_admin_sections.py"
      - ".github/workflows/validate-builders.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python builders
        run: python -m py_compile build-product-pages.py build-admin.py _admin_sections.py
