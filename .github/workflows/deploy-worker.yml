name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Worker JavaScript
        run: node --input-type=module --check < worker/approvals-worker.js
      - name: Validate Python builders
        run: python -m py_compile build-admin.py build-product-pages.py
      - name: Deploy Worker
        if: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --config worker/wrangler.toml
      - name: Explain skipped deployment
        if: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::error::Worker was checked but NOT deployed. Add the CLOUDFLARE_API_TOKEN repository secret and rerun this workflow."
          exit 1
